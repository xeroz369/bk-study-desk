# Dependabot: báo và tự mở PR khi thư viện có lỗ hổng hoặc bản mới. Gom theo tuần cho đỡ nhiễu.
# cooldown: bản mới phải ra ít nhất 7 ngày mới được đề xuất (tránh dính gói bị chiếm quyền vừa phát hành); bản vá lỗ hổng không phải chờ.
version: 2
updates:
  - package-ecosystem: nuget
    directories: ['/src/BKStudyDesk.Core', '/src/BKStudyDesk.Desktop', '/src/BKStudyDesk.Setup', '/tests/BKStudyDesk.Logic.Tests', '/tests/BKStudyDesk.Core.Tests', '/tests/BKStudyDesk.Math.Tests']
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      nuget: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /studypack
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      npm: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
