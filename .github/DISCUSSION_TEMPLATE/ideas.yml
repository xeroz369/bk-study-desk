title: "Đề xuất: "
body:
  - type: markdown
    attributes:
      value: |
        App chỉ đọc dữ liệu của trường. Việc cần nộp bài, đăng ký môn hay sửa dữ liệu trên LMS, MyBK sẽ không làm.
  - type: textarea
    id: need
    attributes:
      label: Bạn cần gì
      description: Việc bạn muốn làm được, không cần nghĩ cách làm.
    validations: { required: true }
  - type: textarea
    id: more
    attributes:
      label: Thêm (không bắt buộc)
      description: Ảnh minh họa, app khác làm thế nào.
