name: codeql

# Quét lỗi bảo mật trong mã C# (WPF, cần Windows để build), TypeScript/Svelte (khung Luyện tập) và workflow CI.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

# Quyền cấp workflow để trống, từng job tự khai báo quyền tối thiểu (OpenSSF Scorecard: Token-Permissions).
permissions: {}

jobs:
  analyze:
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-latest
            build-mode: manual
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          # File workflow của GitHub Actions (quyền token, chèn lệnh từ dữ liệu PR...).
          - language: actions
            os: ubuntu-latest
            build-mode: none
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Chỉ luật bảo mật: bộ "quality" báo hàng trăm nhắc kiểu code (Path.Combine, catch rỗng...) làm chìm cảnh báo thật.
          queries: security-extended
      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          dotnet build src/BKStudyDesk.Desktop -c Release -f net10.0-windows10.0.19041.0
          dotnet build src/BKStudyDesk.Setup -c Release
      # Repo private (bản xem trước) không có Code scanning miễn phí: vẫn quét, lưu kết quả SARIF làm artifact thay vì gửi lên.
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event.repository.private
        with:
          name: codeql-${{ matrix.language }}
          path: sarif