name: codeql

# Quét lỗi bảo mật trong mã C# (WPF, cần Windows để build), TypeScript/Svelte (khung Luyện tập) và workflow CI.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-latest
            build-mode: manual
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          # File workflow của GitHub Actions (quyền token, chèn lệnh từ dữ liệu PR...).
          - language: actions
            os: ubuntu-latest
            build-mode: none
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Chỉ luật bảo mật: bộ "quality" báo hàng trăm nhắc kiểu code (Path.Combine, catch rỗng...) làm chìm cảnh báo thật.
          queries: security-extended
          # Script kiểm thử chạy trên máy dev (nối DevTools cục bộ), không nằm trong app phát hành.
          config: |
            paths-ignore:
              - src/ui/scripts
      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          dotnet build src/SoHocTap -c Release
          dotnet build src/BKStudyDesk.Setup -c Release
      # Repo private (bản xem trước) không có Code scanning miễn phí: vẫn quét, lưu kết quả SARIF làm artifact thay vì gửi lên.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif
      - uses: actions/upload-artifact@v7
        if: github.event.repository.private
        with:
          name: codeql-${{ matrix.language }}
          path: sarif