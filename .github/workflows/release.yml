name: release

# Build bộ cài bản đa nền tảng (Avalonia, src/BKStudyDesk.Desktop): Windows x64, ARM64 (bộ cài tiếng Việt bọc Velopack),
# Linux x64 (AppImage), macOS Apple Silicon, Intel (.pkg, chưa ký số); gói tự cập nhật cho từng kênh; gói MSIX cho Microsoft Store
# (cùng app, target Windows).
# - Đẩy tag vX.Y.Z (hoặc chạy tay): tạo release NHÁP vX.Y.Z chỉ có bộ cài + SHA256SUMS.txt (job checksums); gói cập nhật và MSIX để ở artifact.
# - Bấm Publish release: job publish-feed mới đưa gói cập nhật lên release cố định "updates",
#   nên app của người dùng chỉ thấy bản mới sau khi người làm app đã duyệt bản nháp.
# - Cùng lúc đó job publish-store nộp MSIX lên Microsoft Store (chờ người làm app duyệt ở environment "microsoft-store").
#   Store còn kiểm duyệt thêm vài ngày nên bản Store thường ra sau bản GitHub.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản (vd. 1.0.7). Để trống khi chỉ nộp Store.'
        required: false
      tag:
        description: 'Tên tag cho release nháp (để trống = v<phiên bản>)'
        required: false
      store_tag:
        description: 'Chỉ nộp lên Microsoft Store bản đã build của tag này (vd. v1.1.6), không build lại'
        required: false
  release:
    types: [published]

# Quyền đặt riêng cho từng job, mặc định không có quyền gì. Action ghim theo SHA của commit (tag có thể bị dời).
permissions: {}

env:
  VPK_VERSION: '1.2.161'
  PACK_ID: BKStudyDesk

jobs:
  build:
    if: github.event_name != 'release' && inputs.store_tag == ''
    runs-on: windows-latest
    permissions:
      contents: write       # tạo bản nháp release
      id-token: write       # attestation cho bộ cài
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Input chạy tay và tên tag đi qua biến môi trường rồi kiểm định dạng, không chèn thẳng vào script (zizmor template-injection).
      - name: Version
        id: v
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = if ($env:EVENT -eq 'workflow_dispatch') { $env:IN_VERSION } else { $env:REF_NAME.TrimStart('v') }
          $tag = if ($env:IN_TAG) { $env:IN_TAG } else { "v$v" }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Phiên bản không hợp lệ: $v" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+[-.\w]*$') { throw "Tag không hợp lệ: $tag" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Unit tests
        run: |
          dotnet test tests/BKStudyDesk.Logic.Tests
          dotnet test tests/BKStudyDesk.Core.Tests
          dotnet test tests/BKStudyDesk.Math.Tests
      - name: Package
        shell: pwsh
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:V
          dotnet tool install -g vpk --version $env:VPK_VERSION
          $env:VPK_SKIP_UPDATES = 'true'
          New-Item -ItemType Directory -Force dist, feed | Out-Null
          Set-Content notes.md "BK Study Desk $v" -NoNewline
          $common = "-p:Version=$v", '-p:DebugType=none', '-p:DebugSymbols=false', '-p:ContinuousIntegrationBuild=true', '-p:Deterministic=true', '-p:SatelliteResourceLanguages=en%3Bvi'
          foreach ($rid in 'win-x64', 'win-arm64') {
            # Lấy bản trước từ release "updates" (nếu có) để vpk tạo gói delta nhỏ cho người đang dùng bản cũ.
            vpk download http --url "https://github.com/$env:GITHUB_REPOSITORY/releases/download/updates" -c $rid -o "feed/$rid" --allowEmptyChannel
            if ($LASTEXITCODE) { Write-Host "Chưa có bản trước cho $rid, chỉ tạo gói đầy đủ."; $global:LASTEXITCODE = 0 }
            dotnet publish src/BKStudyDesk.Desktop -c Release -f net10.0-windows10.0.19041.0 -r $rid --self-contained true -o "stage/$rid" @common
            if ($LASTEXITCODE) { throw "publish $rid lỗi" }
            vpk pack -u $env:PACK_ID -v $v -r $rid -c $rid -p "stage/$rid" -e BKStudyDesk.exe --packTitle 'BK Study Desk' --packAuthors xeroz369 `
              -i src/BKStudyDesk.Desktop/Assets/app.ico --aumid $env:PACK_ID --releaseNotes notes.md --noPortable -o "feed/$rid"
            if ($LASTEXITCODE) { throw "vpk pack $rid lỗi" }
            dotnet build src/BKStudyDesk.Setup -c Release -o "uninstall-$rid" "-p:PackId=$env:PACK_ID" "-p:Version=$v"
            dotnet build src/BKStudyDesk.Setup -c Release -o "setup-$rid" "-p:PackId=$env:PACK_ID" "-p:Version=$v" `
              "-p:VelopackSetup=$PWD/feed/$rid/$env:PACK_ID-$rid-Setup.exe" "-p:UninstallerExe=$PWD/uninstall-$rid/BKStudyDesk-Setup.exe"
            Copy-Item "setup-$rid/BKStudyDesk-Setup.exe" "dist/$env:PACK_ID-$v-Setup-$($rid.Split('-')[1]).exe"
            Remove-Item "feed/$rid/$env:PACK_ID-$rid-Setup.exe"
          }
      # Attestation: chứng minh bộ cài được build từ đúng mã nguồn này trên GitHub Actions (chỉ repo public có tính năng này).
      # Người dùng kiểm: gh attestation verify BKStudyDesk-x.y.z-Setup-x64.exe --repo xeroz369/bk-study-desk
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: 'dist/*.exe'
      # Gói MSIX cho Microsoft Store (x64, chưa ký: Store tự ký khi publish). Dùng chung script với máy dev.
      - name: Store package
        shell: pwsh
        env:
          V: ${{ steps.v.outputs.version }}
        run: ./store/package-msix.ps1 -Version $env:V -Out msix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-${{ steps.v.outputs.tag }}
          path: msix/*.msix
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feed-${{ steps.v.outputs.tag }}
          path: |
            feed/**/*.nupkg
            feed/**/releases.*.json
          retention-days: 90
      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          V: ${{ steps.v.outputs.version }}
        run: |
          $tag = $env:TAG
          gh release create $tag --draft --target $env:GITHUB_SHA --title "BK Study Desk $env:V" --notes "Bản nháp do CI tạo. Kiểm tra bộ cài rồi bấm Publish." (Get-ChildItem dist -File | ForEach-Object FullName)
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}

  # Linux, macOS (bản đa nền tảng, thử nghiệm): đóng gói rồi đưa bộ cài lên bản nháp release do job build tạo.
  build-unix:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write       # đưa bộ cài lên bản nháp release
      id-token: write       # attestation cho bộ cài
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Package
        shell: bash
        env:
          V: ${{ needs.build.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          dotnet tool install -g vpk --version "$VPK_VERSION"
          export VPK_SKIP_UPDATES=true
          mkdir -p dist "feed/$RID"
          printf 'BK Study Desk %s' "$V" > notes.md
          vpk download http --url "https://github.com/$GITHUB_REPOSITORY/releases/download/updates" -c "$RID" -o "feed/$RID" --allowEmptyChannel \
            || echo "Chưa có bản trước cho $RID, chỉ tạo gói đầy đủ."
          dotnet publish src/BKStudyDesk.Desktop -c Release -f net10.0 -r "$RID" --self-contained true -o "stage/$RID" \
            "-p:Version=$V" -p:DebugType=none -p:DebugSymbols=false -p:ContinuousIntegrationBuild=true -p:Deterministic=true
          vpk pack -u "$PACK_ID" -v "$V" -r "$RID" -c "$RID" -p "stage/$RID" -e BKStudyDesk \
            --packTitle 'BK Study Desk' --packAuthors xeroz369 --releaseNotes notes.md -o "feed/$RID"
          if [ "$RUNNER_OS" = "Linux" ]; then
            mv "feed/$RID/$PACK_ID-$RID.AppImage" "dist/$PACK_ID-$V-$RID.AppImage"
          else
            mv "feed/$RID/$PACK_ID-$RID-Setup.pkg" "dist/$PACK_ID-$V-Setup-$RID.pkg"
          fi
          rm -f feed/"$RID"/*-Portable.zip
          ls -la dist "feed/$RID"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feed-${{ matrix.rid }}-${{ needs.build.outputs.tag }}
          path: |
            feed/**/*.nupkg
            feed/**/releases.*.json
          retention-days: 90
      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*

  # SHA256SUMS.txt cho mọi bộ cài của bản nháp (Windows từ job build, Linux, macOS từ build-unix).
  checksums:
    needs: [build, build-unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dl && cd dl
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern 'BKStudyDesk-*'
          sha256sum BKStudyDesk-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber SHA256SUMS.txt

  publish-feed:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write       # tải gói lên release "updates"
      actions: read         # tải artifact của lần build
    steps:
      - name: Upload update packages to the "updates" release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          run=$(gh run list -R "$REPO" --workflow release.yml --json databaseId,headBranch,conclusion,event \
            --jq "[.[] | select(.conclusion==\"success\" and .event!=\"release\" and .headBranch==\"$TAG\")][0].databaseId")
          [ -n "$run" ] || { echo "Không tìm thấy lần build của $TAG"; exit 1; }
          gh run download "$run" -R "$REPO" -n "feed-$TAG" -D feed
          for rid in linux-x64 osx-arm64 osx-x64; do
            gh run download "$run" -R "$REPO" -n "feed-$rid-$TAG" -D feed || echo "Không có gói cập nhật $rid"
          done
          gh release view updates -R "$REPO" >/dev/null 2>&1 || \
            gh release create updates -R "$REPO" --prerelease --title "Gói tự cập nhật (không cần tải)" \
              --notes "App tự tải các file ở đây khi bạn cho phép cập nhật. Muốn cài app thì tải bộ cài ở bản phát hành mới nhất."
          gh release upload updates -R "$REPO" --clobber $(find feed -type f)

  # Nộp MSIX lên Microsoft Store bằng Microsoft Store Developer CLI (msstore), theo hướng dẫn chính thức:
  # https://learn.microsoft.com/windows/apps/publish/msstore-dev-cli/github-actions
  # - Chỉ chạy khi biến repo STORE_PUBLISH = 'true' (đặt sau khi đã cấu hình xong secret Partner Center).
  # - Environment "microsoft-store" bắt người làm app bấm duyệt trước khi job chạy, secret chỉ job này đọc được.
  # - msstore publish tạo submission mới từ bản đang có trên Store, thay package rồi commit; Store kiểm duyệt như nộp tay.
  #   Đang có submission chờ duyệt thì job lỗi, không ghi đè: đợi Store duyệt xong rồi chạy lại job.
  publish-store:
    # Bấm Publish release, hoặc chạy tay với store_tag để nộp lại một bản đã build (vd. khi lần nộp trước lỗi).
    if: vars.STORE_PUBLISH == 'true' && ((github.event_name == 'release' && !github.event.release.prerelease) || inputs.store_tag != '')
    runs-on: windows-latest
    environment: microsoft-store
    permissions:
      actions: read         # tải artifact MSIX của lần build
    env:
      STORE_PRODUCT_ID: 9NX0KRZRR850
      MSSTORE_CLI_VERSION: v0.4.3
    steps:
      - name: Download MSIX
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.store_tag }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Lọc bằng PowerShell, không dùng --jq: dấu \" trong chuỗi pwsh không phải escape nên gh nhận sai tham số.
          $runs = gh run list -R $env:REPO --workflow release.yml --branch $env:TAG --limit 20 --json databaseId,conclusion,event | ConvertFrom-Json
          $run = ($runs | Where-Object { $_.conclusion -eq 'success' -and $_.event -ne 'release' } | Select-Object -First 1).databaseId
          if (!$run) { throw "Không tìm thấy lần build của $env:TAG" }
          gh run download $run -R $env:REPO -n "store-$env:TAG" -D msix
          if ($LASTEXITCODE) { throw 'Không tải được artifact MSIX' }
          Get-ChildItem msix -Filter *.msix | ForEach-Object { "$($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: ${{ env.MSSTORE_CLI_VERSION }}
      - name: Configure msstore
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          # Chẩn đoán trước: xin token client credentials từ Microsoft Entra. Lỗi thì in mã AADSTS (sai secret, sai app, sai tenant,
          # thiếu service principal của Partner Center...). Không in token hay secret.
          foreach ($scope in 'https://manage.devcenter.microsoft.com/.default', 'https://api.store.microsoft.com/.default') {
            try {
              Invoke-RestMethod -Method Post "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/v2.0/token" `
                -Body @{ client_id = $env:CLIENT_ID; client_secret = $env:CLIENT_SECRET; scope = $scope; grant_type = 'client_credentials' } | Out-Null
              Write-Host "Entra: lấy được token cho $scope"
            } catch {
              $err = $_.ErrorDetails.Message | ConvertFrom-Json -ErrorAction SilentlyContinue
              Write-Host "Entra: không lấy được token cho ${scope}: $($err.error) $(($err.error_description -split "`n")[0].Trim())"
            }
          }
          msstore settings --enableTelemetry false
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET --verbose
          if ($LASTEXITCODE) { throw 'Không đăng nhập được Partner Center. Xem dòng "Entra:" ở trên để biết sai secret, app hay tenant.' }
      - name: Submit to Microsoft Store
        shell: pwsh
        env:
          # Gói MSIX của app desktop cần quyền runFullTrust (restricted capability): Store cảnh báo và người kiểm duyệt cần lý do.
          # Ghi vào notesForCertification của bản nộp trước khi commit, mỗi lần nộp đều có (cảnh báo thấy ở bản 1.2.4).
          CERT_NOTES: >-
            BK Study Desk is a desktop app built with .NET and Avalonia, packaged as MSIX. It needs runFullTrust to run as a desktop
            process: it hosts WebView2 to sign in to the university portal, keeps its data in the user's local app data folder, and
            uses a startup task and toast notifications. It does not install drivers or services and does not change system settings.
            The app is read-only towards university systems.
        run: |
          $ErrorActionPreference = 'Stop'
          $id = $env:STORE_PRODUCT_ID
          $msix = (Get-ChildItem msix -Filter *.msix | Select-Object -First 1).FullName
          msstore publish $msix -id $id --noCommit
          if ($LASTEXITCODE) { throw 'Nộp lên Store lỗi (xem log msstore ở trên).' }
          # submission get in JSON kèm dòng trạng thái: lấy từ dấu { đầu tới dấu } cuối.
          $raw = (msstore submission get $id | Out-String)
          if ($LASTEXITCODE) { throw 'Không đọc được bản nháp vừa tạo.' }
          $sub = $raw.Substring($raw.IndexOf('{'), $raw.LastIndexOf('}') - $raw.IndexOf('{') + 1) | ConvertFrom-Json
          $sub | Add-Member -NotePropertyName notesForCertification -NotePropertyValue $env:CERT_NOTES -Force
          $sub | ConvertTo-Json -Depth 100 | msstore submission update $id -
          if ($LASTEXITCODE) { throw 'Không ghi được ghi chú kiểm duyệt vào bản nháp.' }
          msstore submission publish $id
          if ($LASTEXITCODE) { throw 'Không commit được bản nộp (bản nháp vẫn còn trong Partner Center).' }
          msstore submission status $id
