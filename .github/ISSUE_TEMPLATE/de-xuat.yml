name: Đề xuất tính năng
description: Ý tưởng làm app tiện hơn
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Bạn cần gì
      description: Mô tả việc bạn muốn làm được, không cần nghĩ cách làm.
    validations: { required: true }
  - type: textarea
    id: more
    attributes:
      label: Thêm (không bắt buộc)
      description: Ảnh minh họa, app khác làm thế nào…
  - type: markdown
    attributes:
      value: App chỉ **đọc** dữ liệu của trường. Đề xuất cần nộp bài, đăng ký môn hay sửa dữ liệu trên LMS/MyBK sẽ không được làm.