name: Báo lỗi
description: App chạy sai, treo hoặc hiện sai dữ liệu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Đừng dán mật khẩu, MSSV, token hay ảnh có thông tin cá nhân. Lỗ hổng bảo mật thì báo riêng, xem [SECURITY.md](../blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Phiên bản
      description: Góc phải thanh dưới cùng của app
      placeholder: "1.1.10"
    validations: { required: true }
  - type: dropdown
    id: source
    attributes:
      label: Cài từ
      options: [GitHub, Microsoft Store]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: Lỗi gì
      description: Bạn làm gì, app làm gì, bạn mong app làm gì. Có ảnh chụp thì dán vào.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Cách làm lại
      placeholder: "1. Mở trang Lịch\n2. Chọn ...\n3. ..."
  - type: textarea
    id: log
    attributes:
      label: Log (không bắt buộc)
      description: Vài dòng cuối của %LOCALAPPDATA%\BKStudyDesk.Data\data\app.log. Xóa tên, MSSV trước khi dán.
      render: text
